[project]
name = "walris-backend"
version = "0.1.0"
requires-python = ">=3.14"

[tool.ruff]
line-length = 100
# Alembic-generated migrations are historical, generated artifacts, not
# hand-maintained code — don't hold them to our style rules.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modernize syntax)
    "B",   # flake8-bugbear (common bug patterns)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern (`param: X = Depends(...)`) requires
# calling Depends()/Query()/etc. in argument defaults — that's the API, not
# the mutable-default-argument footgun B008 normally guards against.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
